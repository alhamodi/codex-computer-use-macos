[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-use-macos"
version = "6.0.0"
description = "Native macOS Computer Use & Desktop Automation Engine for AI Agents (OpenAI Codex, Anthropic, Gemini)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Carsten Blüm", email = "carsten@bluem.net"},
    {name = "Computer Use Contributors"}
]
keywords = ["computer-use", "cliclick", "macos", "automation", "agent", "llm", "mcp"]
dependencies = [
    "pillow>=9.0.0"
]

[project.optional-dependencies]
agent = [
    "openai>=1.0.0"
]

[project.scripts]
computer-use = "computer_use.cli:main"
computer-mcp = "computer_use.mcp_server:main"
